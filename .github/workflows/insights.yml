name: insights
on:
  schedule:
    - cron: '17 22 * * 0'   # Monday 07:17 JST
  workflow_dispatch:
  push:
    paths: ['scripts/fetch_insights.py', '.github/workflows/insights.yml']
permissions:
  contents: write
concurrency: insights
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch insights
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python scripts/fetch_insights.py
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "Insights $(date -u +%F)" || exit 0
          git push 2>&1 | tail -2 || { echo "::error title=push::push failed"; exit 1; }
      - name: Report failure
        if: failure()
        run: echo "::error title=insights-failed::see step results"
