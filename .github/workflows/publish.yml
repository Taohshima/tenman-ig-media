name: publish
on:
  schedule:
    - cron: '*/10 9-13 * * *'   # every 10 min, 18:00-22:59 JST
  workflow_dispatch:
  push:
    paths: ['queue/**/post.json']
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python scripts/publish.py
      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add queue
          git commit -m "Publish results $(date -u +%FT%H%M)" || exit 0
          git pull --rebase -q && git push
